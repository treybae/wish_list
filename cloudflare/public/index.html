<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trey's Wish List</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column of gift tags; owner tools slide in above the list. */
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --ink: #17302b;
  --muted: #5b6f6a;
  --line: #d6e0dc;
  --pine: #1f4d45;
  --pine-ink: #ffffff;
  --gold: #c98a0b;
  --gold-soft: #fbefd2;
  --danger: #b3261e;
  --ok: #2e7d4f;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a18; --surface: #172522; --ink: #e4eeeb; --muted: #9db2ac; --line: #2a3d39;
    --pine: #6fc3b1; --pine-ink: #0d1d1a; --gold: #f0b93f; --gold-soft: #3a2f14;
    --danger: #ff8a80; --ok: #7bd3a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a18; --surface: #172522; --ink: #e4eeeb; --muted: #9db2ac; --line: #2a3d39;
  --pine: #6fc3b1; --pine-ink: #0d1d1a; --gold: #f0b93f; --gold-soft: #3a2f14;
  --danger: #ff8a80; --ok: #7bd3a0; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
}
main { max-width: 760px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(30px, 6vw, 44px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 700; }
header { display: grid; gap: 8px; padding-top: 12px; }
header p { margin: 0; color: var(--muted); max-width: 60ch; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; font-weight: 600; }
button.primary { background: var(--pine); color: var(--pine-ink); border-color: var(--pine); }
button.ghost { background: transparent; border-color: transparent; padding-inline: 8px; color: var(--muted); }
button.danger { color: var(--danger); }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
a { color: var(--pine); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.list { display: grid; gap: 12px; }
.tag {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px 16px 30px; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; min-width: 0;
}
.tag .body { display: grid; gap: 8px; min-width: 0; align-content: start; }
/* item picture, or a tidy stand-in when there is none */
.pic {
  width: 84px; height: 112px; border-radius: 8px; overflow: hidden; background: var(--bg);
  border: 1px solid var(--line); display: grid; place-items: center;
}
.pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pic.none { font-family: var(--display); font-size: 30px; font-weight: 700; color: var(--muted);
  background: repeating-linear-gradient(135deg, var(--bg) 0 8px, var(--surface) 8px 16px); }
.preview { display: flex; align-items: center; gap: 12px; grid-column: 1 / -1; }
.preview .note { font-size: 13px; color: var(--muted); }
@media (max-width: 420px) { .tag { grid-template-columns: 64px minmax(0, 1fr); } .pic { width: 64px; height: 86px; } }
/* the punched hole of a gift tag */
.tag::before {
  content: ""; position: absolute; left: 11px; top: 20px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line);
}
.tag.p1::before { box-shadow: inset 0 0 0 2px var(--gold); }
.row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; justify-content: space-between; }
.name { font-family: var(--display); font-size: 18px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.price { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.pill { border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); }
.pill.need { border-color: var(--pine); color: var(--pine); }
.pill.p1 { background: var(--gold-soft); border-color: transparent; color: var(--ink); }
.pill.claimed { background: var(--ok); color: var(--surface); border-color: transparent; }
.notes { margin: 0; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.claimbox { display: grid; gap: 8px; padding-top: 4px; }
.claimbox label { font-size: 13px; color: var(--muted); }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
textarea { min-height: 70px; resize: vertical; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field span { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.mine { border-style: dashed; border-color: var(--pine); }
.empty { color: var(--muted); text-align: center; padding: 28px 12px; border: 1px dashed var(--line); border-radius: var(--radius); }
.msg { font-size: 14px; min-height: 1em; margin: 0; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--ok); }
.ownerbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.switch { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
.switch input { width: auto; }
footer { text-align: center; color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .tag { transition: opacity .2s; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="eyebrow" id="eyebrow">Wish list</span>
    <h1 id="title">Trey's Wish List</h1>
    <p id="lede">Pick something, tap <strong>I'll get this</strong>, and it comes off the list so nobody else buys it too.</p>
  </header>

  <!-- Owner tools -->
  <section id="owner" hidden>
    <div class="panel">
      <div class="ownerbar">
        <h2 id="formTitle">Add something</h2>
        <div class="actions">
          <label class="switch"><input type="checkbox" id="reveal"> Show what's been claimed</label>
          <button class="ghost" id="signOut" type="button">Sign out</button>
        </div>
      </div>
      <form id="itemForm" class="grid2" autocomplete="off">
        <label class="field" style="grid-column: 1 / -1"><span>What is it</span><input id="f_name" required maxlength="200" placeholder="e.g. Merino hiking socks, size L"></label>
        <label class="field" style="grid-column: 1 / -1"><span>Link (optional)</span><input id="f_url" type="url" maxlength="2000" placeholder="https://"></label>
        <label class="field" style="grid-column: 1 / -1"><span>Picture link (optional)</span><input id="f_image" type="url" maxlength="2000" placeholder="https:// link to a photo of it"></label>
        <div class="preview" id="imgPreview" hidden></div>
        <label class="field"><span>Price (optional)</span><input id="f_price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="25.00"></label>
        <label class="field"><span>Want or need</span><select id="f_kind"><option value="want">Want</option><option value="need">Need</option></select></label>
        <label class="field"><span>How much</span><select id="f_priority"><option value="1">Really want</option><option value="2" selected>Would like</option><option value="3">Nice to have</option></select></label>
        <label class="field" style="grid-column: 1 / -1"><span>Notes (optional)</span><textarea id="f_notes" maxlength="1000" placeholder="Color, size, model, where to buy"></textarea></label>
        <div class="actions" style="grid-column: 1 / -1">
          <button class="primary" type="submit" id="saveBtn">Add to list</button>
          <button type="button" id="cancelEdit" hidden>Cancel edit</button>
          <p class="msg" id="formMsg" role="status"></p>
        </div>
      </form>
    </div>
  </section>

  <section id="signin" class="panel" hidden>
    <h2 id="signinTitle">Sign in to edit your list</h2>
    <form id="signinForm" class="grid2">
      <input type="text" name="username" value="owner" autocomplete="username" hidden>
      <label class="field" style="grid-column: 1 / -1"><span>Passphrase</span><input id="s_pass" type="password" autocomplete="current-password" required></label>
      <div class="actions" style="grid-column: 1 / -1">
        <button class="primary" type="submit" id="signinBtn">Sign in</button>
        <button class="ghost" type="button" id="closeSignin">Back to the list</button>
      </div>
      <p class="msg" id="signinMsg" role="status" style="grid-column: 1 / -1"></p>
    </form>
  </section>

  <section id="mineSec" hidden>
    <h2 style="margin-bottom:10px">You're getting these</h2>
    <div class="list" id="mineList"></div>
  </section>

  <section>
    <div class="chips" role="group" aria-label="Filter" style="margin-bottom:12px">
      <button type="button" data-f="all" aria-pressed="true">Everything</button>
      <button type="button" data-f="need" aria-pressed="false">Needs</button>
      <button type="button" data-f="want" aria-pressed="false">Wants</button>
    </div>
    <p class="msg" id="listMsg" role="status"></p>
    <div class="list" id="list"><div class="empty">Loading the list…</div></div>
  </section>

  <footer><button class="ghost" type="button" id="ownerLink">Trey? Sign in to edit</button></footer>
</main>

<script src="/app.js"></script>
</body>
</html>
